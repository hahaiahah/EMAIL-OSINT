<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMAIL-OSINT | فاحص الأصول الرقمية</title>
    <!-- مكتبة تحليل أرقام الهاتف -->
    <script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.11.1/bundle/libphonenumber-min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.2rem;
            color: #00ff88;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            color: #aaa;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle-btn.active {
            background: #00ff88;
            border-color: #00ff88;
            color: #0d0d0d;
            font-weight: bold;
        }

        .toggle-btn:hover:not(.active) {
            border-color: #00ff88;
            color: #00ff88;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .form-card {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .form-card input {
            width: 100%;
            padding: 15px;
            background: #0d0d0d;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .form-card input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .btn-run {
            width: 100%;
            padding: 15px;
            background: #00ff88;
            color: #0d0d0d;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-run:hover {
            background: #00cc6a;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .result-box {
            margin-top: 10px;
        }

        .result-card {
            background: #1a1a1a;
            border-left: 4px solid #00ff88;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: right;
            margin-bottom: 15px;
        }

        .result-card h3 {
            color: #00ff88;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .result-card p {
            margin: 8px 0;
            color: #ccc;
            font-size: 0.95rem;
        }

        .result-card .warning {
            color: #ff6b6b;
            font-weight: bold;
        }

        .result-card .good {
            color: #00ff88;
        }

        .loading {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            color: #aaa;
        }

        .error {
            background: #1a1a1a;
            border-right: 4px solid #ff4444;
            padding: 15px;
            border-radius: 8px;
            color: #ff6b6b;
        }

        .footer-note {
            margin-top: 30px;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️</div>
        <h1>EMAIL-OSINT</h1>
        <p class="subtitle">أداة استخبارات المصادر المفتوحة</p>

        <!-- تبويبات -->
        <div class="toggle-group">
            <button class="toggle-btn active" onclick="switchTab('email')">📧 بريد إلكتروني</button>
            <button class="toggle-btn" onclick="switchTab('phone')">📱 رقم هاتف</button>
        </div>

        <!-- تبويب البريد -->
        <div id="emailTab" class="tab-content active">
            <div class="form-card">
                <input type="email" id="emailInput" placeholder="example@domain.com" dir="ltr">
                <button class="btn-run" onclick="analyzeEmail()">⚡ تحليل البريد</button>
            </div>
            <div id="emailResult" class="result-box"></div>
        </div>

        <!-- تبويب الهاتف -->
        <div id="phoneTab" class="tab-content">
            <div class="form-card">
                <input type="tel" id="phoneInput" placeholder="+201234567890" dir="ltr">
                <button class="btn-run" onclick="analyzePhone()">⚡ تحليل الرقم</button>
            </div>
            <div id="phoneResult" class="result-box"></div>
        </div>

        <p class="footer-note">⚠️ للأغراض التعليمية والأخلاقية فقط – البيانات لا تُخزّن ولا تُشارك</p>
    </div>

    <script>
        // ========== دوال البريد الإلكتروني ==========
        async function sha1(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-1', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkBreach(email) {
            const hash = await sha1(email.trim().toLowerCase());
            const prefix = hash.substring(0, 5);
            const suffix = hash.substring(5);
            const url = `https://api.pwnedpasswords.com/range/${prefix}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('فشل الاتصال');
                const text = await response.text();
                const lines = text.split('\n');
                for (let line of lines) {
                    let [hashSuffix, count] = line.split(':');
                    if (hashSuffix.trim().toLowerCase() === suffix) {
                        return parseInt(count);
                    }
                }
                return 0;
            } catch (err) {
                return null;
            }
        }

        async function getMxRecords(domain) {
            const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`;
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                if (data.Answer) {
                    const exchanges = data.Answer.map(a => a.data.split(' ')[1]);
                    return exchanges;
                }
                return [];
            } catch (e) {
                return [];
            }
        }

        async function getIpFromHost(host) {
            const url = `https://dns.google/resolve?name=${encodeURIComponent(host)}&type=A`;
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.Answer) {
                return data.Answer[0].data;
            }
            return null;
        }

        async function geolocate(ip) {
            try {
                const resp = await fetch(`http://ip-api.com/json/${ip}`);
                const data = await resp.json();
                if (data.status === 'success') {
                    return `${data.city}, ${data.regionName}, ${data.country} – ${data.isp}`;
                }
                return 'غير معروف';
            } catch (e) {
                return 'تعذر التحديد';
            }
        }

        async function analyzeEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const resultDiv = document.getElementById('emailResult');
            if (!email || !email.includes('@')) {
                resultDiv.innerHTML = '<div class="error">يرجى إدخال بريد صحيح</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">🔄 جاري التحليل...</div>';

            let output = '<div class="result-card">';
            output += `<h3>📧 ${email}</h3>`;

            // فحص التسريبات
            const breachCount = await checkBreach(email);
            if (breachCount === null) {
                output += '<p>⚠️ تعذر فحص التسريبات</p>';
            } else if (breachCount > 0) {
                output += `<p class="warning">🚨 ظهر في ${breachCount} تسريب بيانات!</p>`;
            } else {
                output += '<p class="good">✅ لم يظهر في أي تسريب معروف</p>';
            }

            // معلومات الخادم
            const domain = email.split('@')[1];
            const mxRecords = await getMxRecords(domain);
            if (mxRecords.length > 0) {
                const mainMx = mxRecords[0];
                output += `<p>📬 خادم البريد الأساسي: ${mainMx}</p>`;
                const ip = await getIpFromHost(mainMx);
                if (ip) {
                    const location = await geolocate(ip);
                    output += `<p>🌍 الموقع التقريبي للخادم: ${location}</p>`;
                } else {
                    output += '<p>🌍 تعذر تحديد موقع الخادم</p>';
                }
            } else {
                output += '<p>📬 لا يوجد سجل MX للنطاق</p>';
            }

            output += '</div>';
            resultDiv.innerHTML = output;
        }

        // ========== دوال الهاتف ==========
        function analyzePhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultDiv = document.getElementById('phoneResult');
            if (!phone) {
                resultDiv.innerHTML = '<div class="error">يرجى إدخال رقم هاتف</div>';
                return;
            }

            try {
                const parsed = libphonenumber.parsePhoneNumber(phone);
                if (!parsed.isValid()) {
                    resultDiv.innerHTML = '<div class="error">رقم غير صالح، تأكد من الصيغة الدولية (+966...)</div>';
                    return;
                }

                let output = '<div class="result-card">';
                output += `<h3>📱 ${parsed.formatInternational()}</h3>`;
                output += `<p>🌐 الدولة: ${parsed.country || 'غير معروف'}</p>`;
                output += `<p>🏢 المشغل (شركة الاتصالات): ${parsed.carrier || 'غير معروف'}</p>`;
                output += `<p>🏷️ النوع: ${parsed.getType() || 'غير معروف'}</p>`;
                output += `<p>✅ الرقم صالح: نعم</p>`;
                output += '</div>';
                resultDiv.innerHTML = output;
            } catch (e) {
                resultDiv.innerHTML = '<div class="error">حدث خطأ في التحليل. تأكد من إدخال رقم بصيغة دولية كاملة.</div>';
            }
        }

        // ========== التبويبات ==========
        function switchTab(tab) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            if (tab === 'email') {
                document.querySelector('.toggle-btn:nth-child(1)').classList.add('active');
                document.getElementById('emailTab').classList.add('active');
            } else {
                document.querySelector('.toggle-btn:nth-child(2)').classList.add('active');
                document.getElementById('phoneTab').classList.add('active');
            }
            // مسح النتائج القديمة
            document.getElementById('emailResult').innerHTML = '';
            document.getElementById('phoneResult').innerHTML = '';
        }
    </script>
</body>
</html>
